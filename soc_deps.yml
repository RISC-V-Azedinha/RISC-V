targets:
  alu:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/alu.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_alu.py
  
  imm_gen:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/imm_gen.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_imm_gen.py

  alu_control:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/alu_control.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_alu_control.py

  branch_unit:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/branch_unit.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_branch_unit.py

  lsu:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/lsu.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_lsu.py

  reg_file:
    - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
    - rtl/single_cycle/core/reg_file.vhd
    - sim/single_cycle/include/test_utils.py
    - sim/single_cycle/unit/test_reg_file.py

  decoder:
    deps:
      - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
      - rtl/single_cycle/pkg/riscv_uarch_pkg.vhd
      - rtl/single_cycle/core/decoder.vhd
      - rtl/single_cycle/core/wrappers/decoder_wrapper.vhd
      - sim/single_cycle/include/test_utils.py
      - sim/single_cycle/unit/test_decoder.py
    wrapper_top: decoder_wrapper
    wrapper_src: rtl/single_cycle/core/wrappers/decoder_wrapper.vhd

  control:
    deps:
      - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
      - rtl/single_cycle/pkg/riscv_uarch_pkg.vhd
      - rtl/single_cycle/core/control.vhd
      - rtl/single_cycle/core/wrappers/control_wrapper.vhd
      - sim/single_cycle/include/test_utils.py
      - sim/single_cycle/integration/test_control.py
    wrapper_top: control_wrapper
    wrapper_src: rtl/single_cycle/core/wrappers/control_wrapper.vhd

  datapath:
    deps:
      - rtl/single_cycle/pkg/riscv_isa_pkg.vhd
      - rtl/single_cycle/pkg/riscv_uarch_pkg.vhd
      - rtl/single_cycle/core/datapath.vhd
      - rtl/single_cycle/core/wrappers/datapath_wrapper.vhd
      - sim/single_cycle/include/test_utils.py
      - sim/single_cycle/integration/test_datapath.py
    wrapper_top: datapath_wrapper
    wrapper_src: rtl/single_cycle/core/wrappers/datapath_wrapper.vhd
