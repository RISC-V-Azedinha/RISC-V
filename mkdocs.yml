site_name: SoC RISC-V
site_description: SoC RISC-V didático em VHDL — núcleo RV32I_Zicsr multiciclo, interconexão crossbar, DMA, periféricos e NPU, validado em FPGA.
site_url: https://RISC-V-Azedinha.github.io/RISC-V/
repo_name: RISC-V
repo_url: https://github.com/RISC-V-Azedinha/RISC-V
edit_uri: edit/main/docs/
copyright: Copyright &copy; RISC-V-Azedinha

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: datetime
      locale: pt
      fallback_to_build_date: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RISC-V-Azedinha/RISC-V

nav:
  - Início:
      - Introdução: index.md
      - Primeiros passos: primeiros-passos.md
  - Processador:
      - Microarquitetura monociclo: processador/monociclo.md
      - Microarquitetura multiciclo: processador/multiciclo.md
      - Exceções e interrupções: processador/interrupcoes.md
  - SoC:
      - Interconexão: soc/interconexao.md
      - Memória e DMA: soc/memoria-dma.md
      - Controlador de depuração: soc/depuracao.md
  - Periféricos:
      - GPIO: perifericos/gpio.md
      - UART: perifericos/uart.md
      - VGA: perifericos/vga.md
      - Cartão microSD: perifericos/sd.md
      - NPU: perifericos/npu.md
  - Software:
      - Compilação e build: software/build.md
      - Boot: software/boot.md
      - Linker scripts: software/linker.md
  - HAL:
      - Visão geral: hal/index.md
      - UART e UART2: hal/uart.md
      - GPIO: hal/gpio.md
      - Temporizador: hal/temporizador.md
      - Interrupções: hal/interrupcoes.md
      - DMA: hal/dma.md
      - VGA: hal/vga.md
      - NPU: hal/npu.md
      - Aritmética em software: hal/aritmetica.md
  - Aplicações:
      - Programas e testes: aplicacoes/programas.md
      - Servidores da NPU: aplicacoes/servidores-npu.md
      - Ferramentas do hospedeiro: aplicacoes/ferramentas.md
  - Desenvolvimento:
      - Verificação: desenvolvimento/verificacao.md
      - Síntese em FPGA: desenvolvimento/sintese.md
