name: SoC RISC-V CI Pipeline

on:
  push:
    branches:
      - "main"
      - "feature/build-system"
  pull_request:
    branches: [ "main" ]

jobs:

  # ==========================================
  # JOB 1: CONTROLADOR DE TRÁFEGO (Paths Filter)
  # ==========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      hardware: ${{ steps.filter.outputs.hardware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hardware:
              - 'rtl/**'
              - 'sim/**'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # ==========================================
  # JOB 2: SIMULAÇÃO INTELIGENTE (Smart Test)
  # ==========================================
  rtl-simulation:
    name: Cocotb Smart Tests
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Bypass Message (If No HW Changes)
        if: ${{ needs.changes.outputs.hardware == 'false' }}
        run: echo "✅ Nenhuma alteração de hardware detectada. Simulação finalizada em bypass."

      - name: Checkout do código
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRÍTICO: Necessário para o smart_test.py ver o histórico do Git e fazer o diff

      - name: Instalar Dependências de Sistema (GHDL e RISC-V GCC)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf make

      - name: Configurar Ambiente Python (Cocotb)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          python3 -m pip install --upgrade pip
          pip install cocotb cocotb-test pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Testes Inteligentes
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: python3 scripts/smart_test.py

  # ==========================================
  # JOB 3: COMPLIANCE (RV32I E2E)
  # ==========================================
  compliance-verification:
    name: RV32I Compliance Suite
    runs-on: ubuntu-latest
    needs: [changes, rtl-simulation]

    steps:
      - name: Bypass Message (If No HW Changes)
        if: ${{ needs.changes.outputs.hardware == 'false' }}
        run: echo "✅ Nenhuma alteração de hardware detectada. Compliance E2E finalizado em bypass."

      - name: Checkout do código
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        uses: actions/checkout@v4

      - name: Instalar Dependências de Sistema (GHDL e RISC-V GCC)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf make

      - name: Configurar Ambiente Python (Cocotb)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          python3 -m pip install --upgrade pip
          pip install cocotb cocotb-test pytest

      - name: Executar Verificação Oficial (100% Compliance Suite)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: make test-compliance

      # - name: Salvar Logs de Falha e Ondas
      #   if: failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: compliance-error-traces
      #     path: build/  # Salva a pasta inteira para você poder baixar os arquivos .vcd e o results.xml do Cocotb
      #     retention-days: 5