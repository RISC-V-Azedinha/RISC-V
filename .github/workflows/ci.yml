name: SoC RISC-V Verification Pipeline

on:
  push:
    branches: [ "feature/build-system" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ================================================
  # JOB 1: CONTROLADOR DE TRÁFEGO (Paths Filter)
  # ================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      hardware: ${{ steps.filter.outputs.hardware }}
      single_cycle: ${{ steps.filter.outputs.single_cycle }}
      multi_cycle: ${{ steps.filter.outputs.multi_cycle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 🛑 AQUI ESTÁ O SEGREDO: Se for push, olha só para o commit atual. Se for PR, olha para a main.
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          filters: |
            hardware:
              - 'rtl/**'
              - 'sim/**'
              - 'scripts/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            single_cycle:
              - 'rtl/core/single_cycle/**'
              - 'rtl/core/single_cycle/pkg/**'
            multi_cycle:
              - 'rtl/core/multi_cycle/**'
              - 'rtl/core/multi_cycle/pkg/**'

  # ================================================
  # JOB 2: SIMULAÇÃO INTELIGENTE (Smart Test)
  # ================================================
  rtl-simulation:
    name: Cocotb Smart Tests
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Bypass Message (If No HW Changes)
        if: ${{ needs.changes.outputs.hardware == 'false' }}
        run: echo "✅ Nenhuma alteração de hardware detectada. Simulação finalizada em bypass."

      - name: Checkout do código
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Dependências de Sistema (GHDL e RISC-V GCC)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf make

      - name: Configurar Ambiente Python (Cocotb)
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: |
          python3 -m pip install --upgrade pip
          pip install cocotb cocotb-test pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Testes Inteligentes
        if: ${{ needs.changes.outputs.hardware == 'true' }}
        run: python3 scripts/smart_test.py

  # ================================================
  # JOB 3: COMPLIANCE (RV32I E2E)
  # ================================================
  compliance-verification:
    name: RV32I Compliance Suite
    runs-on: ubuntu-latest
    needs: [changes, rtl-simulation]
    
    # ⚡ OTIMIZAÇÃO: Cancela o Job inteiro se nenhum core mudou
    if: ${{ needs.changes.outputs.single_cycle == 'true' || needs.changes.outputs.multi_cycle == 'true' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Sistema (GHDL e RISC-V GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf make

      - name: Configurar Ambiente Python (Cocotb)
        run: |
          python3 -m pip install --upgrade pip
          pip install cocotb cocotb-test pytest

      - name: Executar Compliance Oficial (Single Cycle)
        if: ${{ needs.changes.outputs.single_cycle == 'true' }}
        run: make test-compliance CORE_ARCH=single_cycle

      - name: Executar Compliance Oficial (Multi Cycle)
        if: ${{ needs.changes.outputs.multi_cycle == 'true' }}
        run: make test-compliance CORE_ARCH=multi_cycle